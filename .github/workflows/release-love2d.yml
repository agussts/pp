name: Release LÖVE2D (Windows x64 + .love)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag para el release (ej: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    env:
      GAME_NAME: "pp"         # si vacío, usa el nombre del repo
      LOVE_VERSION: "11.5"  # tag oficial (zip: love-11.5-win64.zip)
      LOVE_WIN_FLAVOR: "win64"
      SOURCE_DIR: "."       # pon "src" si main.lua vive en otra carpeta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar GAME_NAME desde el repo (si no está seteado)
        shell: pwsh
        run: |
          if ("${{ env.GAME_NAME }}" -eq "") {
            $repo = "$env:GITHUB_REPOSITORY".Split("/")[1]
            "GAME_NAME=$repo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "GAME_NAME=${{ env.GAME_NAME }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Preparar carpetas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path tmp  | Out-Null

      - name: Crear .love (zip del juego desde SOURCE_DIR, con exclusiones)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $gameName  = "${{ env.GAME_NAME }}"
          $lovePath  = "build/$gameName.love"

          $rootPath  = (Resolve-Path ".").Path
          $srcDir    = (Resolve-Path "${{ env.SOURCE_DIR }}").Path
          Set-Location -Path $srcDir

          $excludes = @(
            ".git", ".github", ".vscode",
            "README.md", "Makefile", "conf.lua", "config.ld",
            "build", "dist", "tmp"
          )

          # Archivos RELATIVOS (para que el zip tenga main.lua en la raíz)
          $relFiles = Get-ChildItem -Recurse -File | Where-Object {
            $keep = $true
            foreach ($ex in $excludes) {
              if ($_.FullName -like "*\$ex*") { $keep = $false; break }
            }
            $keep
          } | ForEach-Object { (Resolve-Path -Relative $_.FullName) }

          if (-not (Test-Path ".\main.lua")) {
            Write-Host "⚠️ No se encontró main.lua en ${srcDir}. El .love requiere main.lua en la raíz."
          }

          if ($relFiles.Count -eq 0) {
            Write-Host "No se encontraron archivos para empaquetar. Contenido en $($srcDir):"
            Get-ChildItem -Recurse | Select-Object FullName
            throw "No hay archivos para el .love (¿SOURCE_DIR correcto? ¿exclusiones demasiado amplias?)"
          }

          $loveAbs = Join-Path $rootPath $lovePath

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            Compress-Archive -Path $relFiles -DestinationPath $loveAbs -Force
          } else {
            & 7z a -tzip "`"$loveAbs`"" $relFiles | Out-Null
          }

          Set-Location -Path $rootPath
          if (-not (Test-Path $lovePath)) { throw "No se generó $lovePath" }
          Write-Host "✅ OK: generado $lovePath"


      - name: Descargar LÖVE Windows oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/love2d/love/releases/download/${{ env.LOVE_VERSION }}/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          $zip = "tmp/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath tmp -Force

      - name: Construir EXE fusionado (copiando TODO el runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveDir = Get-ChildItem -Directory tmp | Where-Object { $_.Name -like "love-*" } | Select-Object -First 1
          if (-not $loveDir) { throw "No se encontró carpeta extraída de LÖVE." }

          $src = $loveDir.FullName
          $out = "dist/${env:GAME_NAME}-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Copiar TODO el contenido del zip oficial (dlls, txts, etc.)
          Copy-Item -Path "$src\*" -Destination $out -Recurse -Force

          # Fusionar love.exe + juego.love => GAME_NAME.exe
          $loveExe  = Join-Path $out "love.exe"
          $gameLove = Join-Path "build" "$env:GAME_NAME.love"
          $gameExe  = Join-Path $out "$env:GAME_NAME.exe"

          if (-not (Test-Path $gameLove)) { throw "Falta $gameLove" }
          cmd /c "copy /b `"$loveExe`"+`"$gameLove`" `"$gameExe`" > NUL"

          # Quitar love.exe (opcional)
          Remove-Item $loveExe -Force

          if (-not (Test-Path $gameExe)) { throw "No se generó $gameExe" }
          Write-Host "EXE generado: $gameExe"
          Write-Host "Contenido en ${out}:"
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }

      - name: Empaquetar ZIP de Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = "dist/${env:GAME_NAME}-win64.zip"
          if (-not (Test-Path "dist/${env:GAME_NAME}-win64")) { throw "No existe carpeta dist/${env:GAME_NAME}-win64" }

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            Compress-Archive -Path "dist/${env:GAME_NAME}-win64/*" -DestinationPath $zipPath -Force
          } else {
            & 7z a -tzip "`"$zipPath`"" "dist/${env:GAME_NAME}-win64/*" | Out-Null
          }

          if (-not (Test-Path $zipPath)) { throw "No se generó $zipPath" }
          Write-Host "ZIP listo: $zipPath"

      - name: Subir artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-builds
          path: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
