name: Release LÖVE2D (Windows x64 + .love)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag para el release (ej: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    env:
      GAME_NAME: ""        # si vacío, usa el nombre del repo
      LOVE_VERSION: "11.5" # tag oficial en GitHub (zip: love-11.5-win64.zip)
      LOVE_WIN_FLAVOR: "win64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar GAME_NAME desde el repo (si no está seteado)
        shell: pwsh
        run: |
          if ("${{ env.GAME_NAME }}" -eq "") {
            $repo = "$env:GITHUB_REPOSITORY".Split("/")[1]
            "GAME_NAME=$repo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "GAME_NAME=${{ env.GAME_NAME }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Preparar carpetas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path tmp  | Out-Null

      # === Igual que antes, pero simple: crear .love con exclusiones ===
      - name: Crear .love (con exclusiones)
        shell: pwsh
        run: |
          $lovePath = "build/$env:GAME_NAME.love"
          $excludes = @(
            ".git", ".github", ".vscode",
            "README.md", "Makefile", "conf.lua", "config.ld",
            "build", "dist", "tmp"
          )
          $all = Get-ChildItem -Recurse -File | Where-Object {
            $keep = $true
            foreach ($ex in $excludes) {
              if ($_.FullName -like "*\$ex*") { $keep = $false; break }
            }
            $keep
          } | Select-Object -ExpandProperty FullName

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            Compress-Archive -Path $all -DestinationPath $lovePath -Force
          } else {
            & 7z a -tzip "`"$lovePath`"" $all | Out-Null
          }
          if (-not (Test-Path $lovePath)) { throw "No se generó $lovePath" }
          Write-Host "✅ OK: generado $lovePath"

      - name: Descargar LÖVE Windows oficial
        shell: pwsh
        run: |
          $url = "https://github.com/love2d/love/releases/download/${{ env.LOVE_VERSION }}/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          $zip = "tmp/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath tmp -Force

      # === Aquí el cambio clave: copiar TODO el runtime (todas las DLLs + txt) ===
      - name: Construir EXE fusionado (runtime completo)
        shell: pwsh
        run: |
          $loveDir = Get-ChildItem -Directory tmp | Where-Object { $_.Name -like "love-*" } | Select-Object -First 1
          if (-not $loveDir) { throw "No se encontró carpeta extraída de LÖVE." }

          $src = $loveDir.FullName
          $out = "dist/${env:GAME_NAME}-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Copia TODO lo que trae el zip oficial (dlls, love.exe, license.txt, readme.txt, etc.)
          Copy-Item -Path "$src\*" -Destination $out -Recurse -Force

          # Fusionar love.exe + juego.love => GAME_NAME.exe (ruta entrecomillada por espacios)
          $loveExe  = Join-Path $out "love.exe"
          $gameLove = Join-Path "build" "$env:GAME_NAME.love"
          $gameExe  = Join-Path $out "$env:GAME_NAME.exe"

          if (-not (Test-Path $gameLove)) { throw "Falta $gameLove" }
          cmd /c "copy /b `"$loveExe`"+`"$gameLove`" `"$gameExe`" > NUL"

          # Dejar sólo el ejecutable del juego (opcional)
          Remove-Item $loveExe -Force

          if (-not (Test-Path $gameExe)) { throw "No se generó $gameExe" }
          Write-Host "EXE generado: $gameExe"
          Write-Host "Contenido en $($out):"
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }

      - name: Empaquetar ZIP de Windows
        shell: pwsh
        run: |
          $zipPath = "dist/${env:GAME_NAME}-win64.zip"
          if (-not (Test-Path "dist/${env:GAME_NAME}-win64")) { throw "No existe carpeta dist/${env:GAME_NAME}-win64" }
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            Compress-Archive -Path "dist/${env:GAME_NAME}-win64/*" -DestinationPath $zipPath -Force
          } else {
            & 7z a -tzip "`"$zipPath`"" "dist/${env:GAME_NAME}-win64/*" | Out-Null
          }
          if (-not (Test-Path $zipPath)) { throw "No se generó $zipPath" }
          Write-Host "ZIP listo: $zipPath"

      - name: Subir artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-builds
          path: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip

      - name: Publicar GitHub Release (tag desde la UI)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
