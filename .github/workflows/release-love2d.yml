name: Release LÖVE2D (Windows x64 + .love)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag para el release (ej: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    env:
      GAME_NAME: "pp"        # si vacío, usa el nombre del repo
      LOVE_VERSION: "11.5" # tag oficial en GitHub (zip: love-11.5-win64.zip)
      LOVE_WIN_FLAVOR: "win64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar GAME_NAME desde el repo (si no está seteado)
        shell: pwsh
        run: |
          if ("${{ env.GAME_NAME }}" -eq "") {
            $repo = "$env:GITHUB_REPOSITORY".Split("/")[1]
            "GAME_NAME=$repo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "GAME_NAME=${{ env.GAME_NAME }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Preparar carpetas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path tmp  | Out-Null

      - name: Crear .love (con exclusiones)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $game = if ([string]::IsNullOrWhiteSpace("${{ env.GAME_NAME }}")) {
            "$($env:GITHUB_REPOSITORY.Split('/')[1])"
          } else { "${{ env.GAME_NAME }}" }

          $lovePath = "build/$game.love"
          $staging  = "tmp\pkg-love"

          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # robocopy: copiar todo excepto tus exclusiones
          $rc = robocopy . $staging /E /NFL /NDL /NJH /NJS /NP /R:0 /W:0 `
                /XD .git .github .vscode build dist tmp `
                /XF README.md Makefile conf.lua config.ld
          $code = $LASTEXITCODE
          if ($code -ge 8) { throw "robocopy falló con código $code" }
          Write-Host "robocopy OK (exit code $code)"
          $global:LASTEXITCODE = 0

          if (Test-Path $lovePath) { Remove-Item -Force $lovePath }
          Compress-Archive -Path "$staging\*" -DestinationPath $lovePath -Force
          if (-not (Test-Path $lovePath)) { throw "No se generó $lovePath" }

          Write-Host "✅ OK: generado $lovePath"
          $global:LASTEXITCODE = 0
          exit 0



      - name: Descargar LÖVE Windows oficial
        shell: pwsh
        run: |
          $url = "https://github.com/love2d/love/releases/download/${{ env.LOVE_VERSION }}/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          $zip = "tmp/love-${{ env.LOVE_VERSION }}-${{ env.LOVE_WIN_FLAVOR }}.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath tmp -Force

      - name: Construir EXE fusionado (runtime completo)
        shell: pwsh
        run: |
          $loveDir = Get-ChildItem -Directory tmp | Where-Object { $_.Name -like "love-*" } | Select-Object -First 1
          if (-not $loveDir) { throw "No se encontró carpeta extraída de LÖVE." }

          $src = $loveDir.FullName
          $out = "dist/${env:GAME_NAME}-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Copia TODO lo que trae el zip oficial (dlls, love.exe, license.txt, readme.txt, etc.)
          Copy-Item -Path "$src\*" -Destination $out -Recurse -Force
          
          # Fusionar love.exe + juego.love => GAME_NAME.exe (ruta entrecomillada por espacios)
          $loveExe  = Join-Path $out "love.exe"
          $gameLove = Join-Path "build" "$env:GAME_NAME.love"
          $gameExe  = Join-Path $out "$env:GAME_NAME.exe"

          if (-not (Test-Path $gameLove)) { throw "Falta $gameLove" }
          cmd /c "copy /b `"$loveExe`"+`"$gameLove`" `"$gameExe`" > NUL"

          # Dejar sólo el ejecutable del juego (opcional)
          Remove-Item $loveExe -Force

          if (-not (Test-Path $gameExe)) { throw "No se generó $gameExe" }
          Write-Host "EXE generado: $gameExe"
          Write-Host "Contenido en $($out):"
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }

      - name: Empaquetar ZIP de Windows (sin rutas padre)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $outDir  = "dist/${{ env.GAME_NAME }}-win64"
          $zipRel  = "dist/${{ env.GAME_NAME }}-win64.zip"
          $root    = (Resolve-Path ".").Path
          $zipAbs  = Join-Path $root $zipRel

          if (-not (Test-Path $outDir)) { throw "No existe carpeta $outDir" }
          if (Test-Path $zipRel) { Remove-Item -Force $zipRel }

          Push-Location $outDir
          Compress-Archive -Path * -DestinationPath $zipAbs -Force
          Pop-Location

          if (-not (Test-Path $zipRel)) { throw "No se generó $zipRel" }
          Write-Host "ZIP listo: $zipRel"



      - name: Subir artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-builds
          path: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip

      - name: Publicar GitHub Release (tag desde la UI)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            build/${{ env.GAME_NAME }}.love
            dist/${{ env.GAME_NAME }}-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-macos:
    name: Build & Attach (macOS .app)
    runs-on: macos-latest

    env:
      GAME_NAME: "pp"        # si vacío, usa el nombre del repo
      LOVE_VERSION: "11.5" # tag oficial (zip: love-11.5-macos.zip)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar GAME_NAME desde el repo (si no está seteado)
        run: |
          if [ -z "${GAME_NAME}" ]; then
            echo "GAME_NAME=$(basename "$GITHUB_REPOSITORY")" >> $GITHUB_ENV
          else
            echo "GAME_NAME=${GAME_NAME}" >> $GITHUB_ENV
          fi

      - name: Preparar carpetas
        run: |
          mkdir -p build dist tmp

      - name: Crear .love (con exclusiones)
        run: |
          EXCLUDES=(
            .git/\* .github/\* .vscode/\*
            README.md Makefile conf.lua config.ld
            build/\* dist/\* tmp/\*
          )
          cd "$GITHUB_WORKSPACE"
          rm -f "build/${GAME_NAME}.love"
          # zip relativo para que main.lua quede en la raíz del .love
          zip -9 -r "build/${GAME_NAME}.love" . -x "${EXCLUDES[@]}"

      - name: Descargar LÖVE macOS oficial
        run: |
          curl -L -o tmp/love-macos.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          unzip -q tmp/love-macos.zip -d tmp

      # Para probar si funciona mac
      - name: Construir .app fusionada y ajustar Info.plist
        run: |
          APP="dist/${GAME_NAME}.app"
          cp -R "tmp/love.app" "${APP}"
          cp "build/${GAME_NAME}.love" "${APP}/Contents/Resources/"

          PLIST="${APP}/Contents/Info.plist"
          # CFBundleName
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${GAME_NAME}" "${PLIST}" || true
          # CFBundleIdentifier (simple, sin espacios/raros)
          SAFE_ID=$(echo "${GAME_NAME}" | tr -cd '[:alnum:]')
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.${GITHUB_REPOSITORY_OWNER}.${SAFE_ID}" "${PLIST}" || true
          # Quitar asociación global de .love
          /usr/libexec/PlistBuddy -c "Delete :UTExportedTypeDeclarations" "${PLIST}" || true

      - name: Verificar bundle (.app) y plist
        run: |
          APP="dist/${GAME_NAME}.app"
          test -f "$APP/Contents/Resources/${GAME_NAME}.love"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" | grep -q "${GAME_NAME}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          echo "Bundle OK."

      - name: Smoke test del binario (sin GUI)
        run: |
          APP="dist/${GAME_NAME}.app"
          chmod +x "$APP/Contents/MacOS/love"
          "$APP/Contents/MacOS/love" --version
          "$APP/Contents/MacOS/love" --help | head -n 10
          
      - name: Smoke test ejecutando el juego (sale solo)
        run: |
          set -e
          APP="dist/${GAME_NAME}.app"
          # Ejecuta el binario de LÖVE dentro del bundle con la variable de CI
          CI_SMOKETEST=1 "$APP/Contents/MacOS/love"
          echo "Smoke test OK."


      - name: Empaquetar ZIP de macOS (.app)
        run: |
          # ditto preserva recursos/symlinks y añade la carpeta .app como raíz
          ditto -c -k --sequesterRsrc --keepParent "dist/${GAME_NAME}.app" "dist/${GAME_NAME}-macos.zip"
          test -f "dist/${GAME_NAME}-macos.zip"

      - name: Subir artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-macos
          path: dist/${{ env.GAME_NAME }}-macos.zip

      - name: Añadir asset macOS al Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: dist/${{ env.GAME_NAME }}-macos.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

